<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatowanie tekstu</title>
</head>
<body>
    <b>Tekst pogrubiony</b>
    <strong>Również tekst pogrubiony</strong>

    <i>Tekst kursywa</i>
    <!-- Emphasized text -->
    <em>Również tekst napisany kursywą</em>

    H<sub>2</sub>O
    b<sup>2</sup>-4ac

    <u>To jest mój tekst</u>
    <ins>To jest tekst podkreślony</ins>

    <s>Tekst przekreślony</s>
    <del>Tekst przekreślony</del>
    
    <mark>Zakreślacz</mark>
    <small>Mały tekst</small>
</body>
</html>
