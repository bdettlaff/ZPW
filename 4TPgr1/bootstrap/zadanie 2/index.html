        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <body>
        <!-- kolumny zawsze w row -->
        <div class="container">
            <div class="row">
                <div class="col-6 bg-primary text-white">Kolumna 1</div>
                <div class="col-6 bg-success text-white">Kolumna 2</div>
            </div>
        </div>
        <hr>
        <!-- //podział grid zawsze w container lub container-fluid -->
        <div class="container-fluid">
            <div class="row">
                <div class="col-6 bg-primary text-white">Kolumna 1</div>
                <div class="col-6 bg-success text-white">Kolumna 2</div>
            </div>
        </div>
        <hr>
        <!-- //Suma ma być 12, jeśli suma kolumn przekracza 12, to ostatnia kolumna wskakuje do nowej linii -->
        <div class="container">
            <div class="row">
                <div class="col-12 bg-primary text-white">col-6</div>
                <div class="col-4 bg-success text-white">col-4</div>
                <div class="col-2 bg-danger text-white">col-2 </div>
            </div>
        </div>
        <hr>
        <!-- //tekst zawsze wewnątrz kolumny -->
        <div class="container">
            <div class="row bg-light">
              
                <div class="col-12 bg-primary text-white">Tekst</div>
                <div class="col-6 bg-primary text-white">Kolumna 1</div>
                <div class="col-6 bg-success text-white">Kolumna 2</div>
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
