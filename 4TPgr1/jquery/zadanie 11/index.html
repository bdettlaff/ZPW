<html>
    <head>
        <title>Wprowadzenie Jquery</title>
        <script
			  src="https://code.jquery.com/jquery-4.0.0.min.js"
			  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
			  crossorigin="anonymous">
        </script>
        <script>
            $(function(){
               $("#formularz").submit(function(e){
                    e.preventDefault();

                    if($("#nick").val() === ""){
                        $("#info").text("Podaj nick!")
                    } else {
                        $("#info").text("Przesłano nick: " + $("#nick").val())
                    } 
               })
            })
        </script>
        <style>
         </style>
    </head>
    <body>
        <form id="formularz">
            <input type="text" id="nick">
            <button type="submit">Wyślij</button>
        </form>
        <p id="info"></p>
        <hr>
        <!-- zadanie z formularzem 15.10 -->
    </body>
</html>
