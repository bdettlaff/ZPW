                <div class="col-6 bg-primary text-white">col-6</div>

                <div class="col-2 bg-danger text-white">col-2 </div>
            </div>
        </div>
        <hr>
        <!-- Nie wstawiamy tekstu bez col na czysto do row -->

                <div class="col-12">Tekst </div>
                <div class="col-6 bg-primary text-white">Kolumna 1</div>

        </div>

        <div class="bg-warning">
            <div class="m-4 bg-primary text-white">m-4: odstęp NA ZEWNĄTRZ niebieskiego pola</div>
         </div>

        <div class="bg-warning">
            <div class="p-4 bg-primary text-white">p-4: odstęp WEWNĄTRZ niebieskiego pola</div>
        </div>
